name: Keep multiplayer backend awake

# Free Supabase projects pause after a week without activity. This daily call keeps the
# room database awake and purges rooms that have been idle for more than three days.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase and clean up old rooms
        run: |
          curl -fsS -X POST "https://pibgdxukgdpfnnbyddjq.supabase.co/rest/v1/rpc/cleanup_old_rooms" \
            -H "apikey: sb_publishable_qk6mp7VYa5priyy8SUDu9w_3TwwTSyj" \
            -H "Content-Type: application/json" -d '{}'
